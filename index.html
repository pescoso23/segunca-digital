<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="conteudo-titulo">
      <h1 class="titulo-principal">Gerador de Senhas</h1>
      <p class="subtitulo">Crie senhas seguras e aleatórias</p>
    </div>

    <div class="conteudo-senha">
      <form id="formulario-senha">
        <label for="campo-senha">Sua Senha:</label>
        <div class="container-senha">
          <input 
            type="text" 
            id="campo-senha" 
            readonly
            aria-label="Senha gerada">
          <button 
            type="button"
            class="btn-copiar" 
            onclick="copiarSenha()" 
            title="Copiar para área de transferência"
            aria-label="Copiar">
            📋
          </button>
        </div>

        <div class="container-controles">
          <button 
            type="button"
            class="btn-tamanho" 
            onclick="diminuiTamanho()"
            aria-label="Diminuir tamanho da senha">
            −
          </button>
          <span id="numero-senha" class="numero-tamanho" aria-live="polite">8</span>
          <button 
            type="button"
            class="btn-tamanho" 
            onclick="aumentaTamanho()"
            aria-label="Aumentar tamanho da senha">
            +
          </button>
        </div>

        <button type="button" class="btn-gerar" onclick="geraSenha()">Gerar Nova Senha</button>
      </form>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
